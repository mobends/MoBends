// The Minecraft-free animation engine. Must not depend on Minecraft, a mod loader or LWJGL,
// so it can be shared by every Minecraft version. Java 8, so 1.12.2 can use it.
apply plugin: 'java'
apply plugin: 'maven-publish'

group = 'goblinbob.mobends'
archivesBaseName = 'mobends-core'
// Release builds get their version from the core-<version> tag (see .github/workflows/publish-core.yml).
version = project.findProperty('coreVersion') ?: mod_version

sourceCompatibility = targetCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // Shipped by Minecraft itself (these are the versions 1.12.2 ships), so not bundled.
    compileOnly 'com.google.code.gson:gson:2.8.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.1'

    testImplementation 'com.google.code.gson:gson:2.8.0'
    testImplementation 'com.google.code.findbugs:jsr305:3.0.1'
    testImplementation 'junit:junit:4.11'
}

task sourcesJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

publishing {
    publications {
        core(MavenPublication) {
            artifactId = 'mobends-core'
            from components.java
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/mobends/MoBends'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
