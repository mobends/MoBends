# The mod's properties, per Minecraft version and loader.
# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "mobends"
mod.name = "Mo' Bends"
mod.version = "2.0.0-alpha.3"

deps.fabric_loader = "0.20.1"
loomx.loom_version = "1.19-SNAPSHOT"

["1.20.1"]
mod.mc_releases = ["1.20", "1.20.1"]
deps.geckolib = "4.8.4"

[fabric."1.20.1"]
mod.mc_compat = ">=1.20 <=1.20.1"
deps.fabric_api = "0.92.12+1.20.1"
deps.modmenu = "7.2.2"
mod.geckolib_compat = ">=4.6"

[forge."1.20.1"]
mod.mc_compat = "[1.20,1.20.1]"
mod.geckolib_compat = "[4.6,)"
deps.forge = "47.4.29"
# Mixin's MixinExtras, which Forge 1.20.1 doesn't have: built into the jar (see build.forge.gradle.kts).
deps.mixinextras = "0.5.0"

["1.21.1"]
# The Minecraft releases the jar is marked compatible with on Modrinth and CurseForge.
mod.mc_releases = ["1.21", "1.21.1"]

# GeckoLib, whose armour Mo' Bends bends when it's installed (mixin.geckolib); not needed. Built
# against this release, and suggested in this range (fabric.mod.json / neoforge.mods.toml).
deps.geckolib = "4.9.3"

[fabric."1.21.1"]
# The Minecraft range in fabric.mod.json / neoforge.mods.toml.
mod.mc_compat = ">=1.21 <=1.21.1"
# The Fabric API release whose modules the mod bundles (see build.fabric.gradle.kts).
deps.fabric_api = "0.116.17+1.21.1"
# Mod Menu's API (compile only: the Config button opens the Mo' Bends menu if Mod Menu is installed).
deps.modmenu = "11.0.3"
mod.geckolib_compat = ">=4.6"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.1]"
mod.geckolib_compat = "[4.6,)"
deps.neo_loader = "21.1.265"

["26.3"]
mod.mc_releases = ["26.3"]
# GeckoLib 5, published under com.geckolib.
deps.geckolib = "5.5.7"

[fabric."26.3"]
mod.mc_compat = ">=26.3 <26.4"
deps.fabric_api = "0.166.0+26.3"
deps.modmenu = "21.0.0"
mod.geckolib_compat = ">=5.5"
# Fantasy Armor, a mod with GeckoLib armour, and the Cloth Config it needs: in the development client
# with -Pgeckolib, to try the armour on (Modrinth version ids).
deps.fantasy_armor = "4VFDvfvz"
deps.cloth_config = "fg2uyxOW"

[neoforge."26.3"]
mod.mc_compat = "[26.3, 26.4)"
mod.geckolib_compat = "[5.5,)"
deps.fantasy_armor = "MpDggb7F"
deps.cloth_config = "GchRXPnb"
deps.neo_loader = "26.3.0.102"
