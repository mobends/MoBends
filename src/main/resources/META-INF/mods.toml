license = "MIT"
issueTrackerURL = "https://github.com/mobends/MoBends/issues"

modLoader = "javafml"
loaderVersion = "[${forge},)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "GoblinBob"
credits = "Tommsy64 - coding support; ThatSoulyGuy and Sxilverr - keeping the spirit of Mo' Bends alive through their modern port"
description = "If you think that Minecraft characters could be more realistic, instead of steady and rigid animations, this mod is just for you! It makes players seem alive, and adds epic sword animations!"
logoFile = "assets/mobends/textures/logo512.png"
displayURL = "https://mobends.com"
# Forge's update check: the versions per Minecraft version, and its -latest and -recommended promos.
updateJSONURL = "https://mobends.com/mod-update.json"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

# Mo' Bends bends GeckoLib's armour, if it's installed.
[[dependencies.${id}]]
modId = "geckolib"
mandatory = false
versionRange = "${geckolib}"
ordering = "NONE"
side = "CLIENT"
