buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'com.github.johnrengelman.shadow:com.github.johnrengelman.shadow.gradle.plugin:4.0.4'
    }
}

apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'com.github.johnrengelman.shadow'

version = "${mod_version}-${getDate()}"
group = "goblinbob.mobends" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "MoBends_${minecraft_version}"

 // Need this here so eclipse task generates correctly.
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    //mappings channel: 'snapshot', version: '20171003-1.12'
    mappings channel: "${mappings_channel}", version: "${mappings_version}"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            // Play under a fixed name, e.g. to test name selectors: ./gradlew runClient -Pmc_username=BendyTester
            if (project.hasProperty('mc_username')) {
                args '--username', project.property('mc_username')
            }
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The Minecraft-free animation engine, bundled into the mod jar.
    implementation project(':core')

    testImplementation "junit:junit:4.11"
}

jar {
    manifest {
        attributes(
                'Specification-Title': project.name,
                'Specification-Vendor': 'GoblinBob',
                'Built-By': 'GoblinBob',
                'Created-By': System.properties['java.vm.version'] + ' (' + System.properties['java.vm.vendor'] + ')',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'FMLAT': 'accesstransformer.cfg',
                'Implementation-Vendor': 'GoblinBob',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

// FML's dev-time resource pack for the mod is rooted at the directory that holds the @Mod class
// (build/classes/java/main), so the resources must be written next to the classes or nothing under
// assets/ (textures, animators, model definitions, even mcmod.info) is found when running the
// client from Gradle. IntelliJ needs the same for fresh resources during development.
sourceSets { main { output.resourcesDir = java.outputDir } }

// The released jar is the shadow jar (the mod with the core bundled), reobfuscated.
reobf {
    shadowJar {
    }
}
shadowJar.finalizedBy('reobfShadowJar')

// Build-time tools (src/tools), not part of the mod.
sourceSets { tools }
dependencies {
    toolsImplementation 'org.ow2.asm:asm-debug-all:5.2'
}

// Regenerates the accessors of the vanilla fields model definitions can name (core/vanilla) and the
// access transformer entries they need, from the mappings in build/fg_cache.
task generateVanillaFields(type: JavaExec) {
    description = 'Regenerates core/vanilla and the generated access transformer section from the Minecraft mappings.'
    classpath = sourceSets.tools.runtimeClasspath
    main = 'goblinbob.mobends.tools.GenVanillaFields'
    args projectDir.absolutePath, minecraft_version, forge_version, "${mappings_channel}_${mappings_version}"
}

// Fails the build when the generated vanilla accessors were made for other versions than gradle.properties
// names, since they would then miss or misname fields. Only reads the version stamp in each file.
task checkVanillaFields {
    description = 'Checks that core/vanilla and the generated access transformer section match the configured versions.'
    doLast {
        // Keep in sync with the stamp in GenVanillaFields.java.
        def stamp = "generated by generateVanillaFields (src/tools) for ${minecraft_version}-${forge_version} with ${mappings_channel}_${mappings_version}"
        def stale = [
            'src/main/java/goblinbob/mobends/core/vanilla/VanillaModelParts.java',
            'src/main/java/goblinbob/mobends/core/vanilla/VanillaEntityFields.java',
            'src/main/resources/META-INF/accesstransformer.cfg',
        ].findAll { !file(it).isFile() || !file(it).text.toLowerCase().contains(stamp.toLowerCase()) }
        if (!stale.isEmpty())
            throw new GradleException("Generated for other Minecraft, Forge or mappings versions: ${stale.join(', ')}. Run `gradle generateVanillaFields`.")
    }
}
checkVanillaFields.mustRunAfter generateVanillaFields
compileJava.dependsOn checkVanillaFields

task srcJar(type: Jar) {
    build.dependsOn it
    from sourceSets.main.allSource
    from { project(':core').sourceSets.main.allSource }
    classifier = 'sources'
    from file("LICENSE")
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", mod_version
    inputs.property "mcversion", minecraft_version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version': mod_version, 'mcversion':minecraft_version
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Bundling the core along with the mod
shadowJar {
    dependencies {
        include(project(':core'))
    }
}

def getDate() {
    return new Date().format('dd.MM.yy')
}
