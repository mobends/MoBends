name: Build Mod

on:
  push:
    branches: ["forge-1.8.9"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # mobends-core, released from `main`.
  packages: read
  # The comment with the artifacts' links.
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The mod is compiled for Java 8 (the toolchain); Gradle runs on 17, the last JDK set up.
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build
        env:
          # Reads mobends-core from GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mobends-ci-build
          # The remapped jar, the one players install (not the sources).
          path: |
            build/libs/MoBends_1.8.9-*.jar
            !build/libs/*-sources.jar
          retention-days: 30

      - name: Comment PR with artifact URLs
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            let comment = '🦾 Fresh bends, straight out the oven, ready to be tested out:\n';
            for (const artifact of artifacts.data.artifacts) {
              const download_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              comment += `- [${artifact.name}](${download_url})\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Upload build artifacts (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build/logs/
            .gradle/
          retention-days: 7
