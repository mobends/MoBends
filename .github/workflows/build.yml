name: Build Mod

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the source tree rules
        run: .github/scripts/check-sources.sh

      # Gradle runs on 25 (gradle/gradle-daemon-jvm.properties); 21 builds the mod for 1.21.1 and the core, 17 for 1.20.1.
      - name: Set up JDK 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every Minecraft version and loader, and the core with its tests.
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mobends-ci-build
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
          retention-days: 30

      - name: Comment PR with artifact URLs
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            let comment = '🦾 Fresh bends, straight out the oven, ready to be tested out:\n';
            for (const artifact of artifacts.data.artifacts) {
              const download_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              comment += `- [${artifact.name}](${download_url})\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Upload test reports (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            build/reports/
            core/build/reports/
            versions/*/build/reports/
          retention-days: 7
