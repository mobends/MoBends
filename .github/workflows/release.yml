name: Release

# Releases Mo' Bends for 1.8.9 for every release tag (v<version>-1.8.9, e.g. v2.0.0-1.8.9 or
# v2.0.0-alpha.1-1.8.9): builds the mod's jar, attaches it to the tag's GitHub release, and uploads
# it to Modrinth and CurseForge. See CONTRIBUTING.md, *Releasing the mod*. The Legacy Mo' Bends
# resource pack (misc/legacy-pack) is signed and released from main.
#
# The Modrinth and CurseForge tokens are kept to the publishing job, which runs no Gradle and no
# project code.
on:
  push:
    tags:
      - "v*-1.8.9"

permissions:
  contents: read
  # mobends-core, released from `main`.
  packages: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-type: ${{ steps.version.outputs.version-type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag names the mod's version
        id: version
        run: |
          version="$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '[:space:]')"
          if [ "$GITHUB_REF_NAME" != "v${version}-1.8.9" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' doesn't match mod_version $version in gradle.properties (expected v${version}-1.8.9)"
            exit 1
          fi
          case "$version" in
            *alpha*) version_type=alpha ;;
            *beta*|*rc*|*pre*) version_type=beta ;;
            *) version_type=release ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version-type=$version_type" >> "$GITHUB_OUTPUT"

      # The release notes are the version's section of CHANGELOG.md (`## 2.0.0 ...`); a prerelease
      # (2.0.0-alpha.1) without a section of its own takes the section of the version it leads to.
      - name: Take the release notes from the changelog
        run: |
          section() {
            awk -v v="$1" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found { print }' CHANGELOG.md \
              | sed '/./,$!d'
          }
          version="${{ steps.version.outputs.version }}"
          section "$version" > release-notes.md
          if [ ! -s release-notes.md ]; then
            section "${version%%-*}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $version"
            echo "See CHANGELOG.md." > release-notes.md
          fi
          cat release-notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  mod:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The mod is compiled for Java 8 (the toolchain); Gradle runs on 17, the last JDK set up.
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No Gradle cache here: a cache written by another workflow run could change the jar that is
      # published.
      - name: Build the mod
        run: ./gradlew build
        env:
          # Reads mobends-core from GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the jar
        run: |
          # The remapped jar (remapJar), not the sources.
          jars=()
          for jar in build/libs/MoBends_1.8.9-*.jar; do
            case "$jar" in *-sources.jar) ;; *) jars+=("$jar") ;; esac
          done
          if [ "${#jars[@]}" != 1 ] || [ ! -f "${jars[0]}" ]; then
            echo "::error::Expected one remapped jar in build/libs, found: ${jars[*]}"
            exit 1
          fi
          mkdir dist
          cp "${jars[0]}" "dist/MoBends_1.8.9-${{ needs.version.outputs.version }}.jar"

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: dist/*.jar

  github-release:
    needs: [version, mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Attach the jar to the release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            prerelease=()
            if [ "${{ needs.version.outputs.version-type }}" != release ]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Mo' Bends ${{ needs.version.outputs.version }} for Minecraft 1.8.9" \
              --notes-file release/release-notes/release-notes.md "${prerelease[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release/mod/*.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Modrinth and CurseForge. The project ids are repository variables, the tokens repository (or
  # `release` environment) secrets; see CONTRIBUTING.md.
  publish-mod:
    needs: [version, mod]
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check the projects and tokens are set
        run: |
          missing=()
          [ -n "$MODRINTH_PROJECT_ID" ] || missing+=("variable MODRINTH_PROJECT_ID")
          [ -n "$CURSEFORGE_PROJECT_ID" ] || missing+=("variable CURSEFORGE_PROJECT_ID")
          [ -n "$MODRINTH_TOKEN" ] || missing+=("secret MODRINTH_TOKEN")
          [ -n "$CURSEFORGE_TOKEN" ] || missing+=("secret CURSEFORGE_TOKEN")
          if [ "${#missing[@]}" != 0 ]; then
            echo "::error::Not set: ${missing[*]}"
            exit 1
          fi
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: mod
          path: release

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # Leaves the older versions featured: unfeaturing them edits them, which the token
          # (Create versions only) isn't allowed to do. Featured versions are unfeatured by hand.
          modrinth-unfeature-mode: none
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release/*.jar
          name: Mo' Bends ${{ needs.version.outputs.version }} for Minecraft 1.8.9
          version: ${{ needs.version.outputs.version }}+1.8.9
          version-type: ${{ needs.version.outputs.version-type }}
          changelog-file: release/release-notes.md
          loaders: forge
          game-versions: 1.8.9
          java: 8
