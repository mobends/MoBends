name: Publish core

# Publishes the Minecraft-free engine (core/) to GitHub Packages as
# goblinbob.mobends:mobends-core:<version>, for every pushed tag named core-<version>
# (e.g. core-2.0.0), tagged on main. See CONTRIBUTING.md.
on:
  push:
    tags:
      - "core-*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#core-}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' should be core-<version>, e.g. core-2.0.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Gradle runs on 25 (gradle/gradle-daemon-jvm.properties); the core is compiled with 21 for Java 8.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Test and publish
        run: ./gradlew :core:build :core:publish -PcoreVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
