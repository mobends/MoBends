name: Animation lab

# Continuous validation that the KUMO animator assets still reproduce the procedural
# reference frame by frame (see animation-lab/README.md and docs/testing.md).
on:
  push:
    paths:
      - "animation-lab/**"
      - "src/main/java/goblinbob/mobends/core/**"
      - "gradle.properties"
      - "src/main/java/goblinbob/mobends/standard/**"
      - "src/main/resources/assets/mobends/bends/**"
      - ".github/workflows/animation-lab.yml"
  pull_request:
    paths:
      - "animation-lab/**"
      - "src/main/java/goblinbob/mobends/core/**"
      - "gradle.properties"
      - "src/main/java/goblinbob/mobends/standard/**"
      - "src/main/resources/assets/mobends/bends/**"
      - ".github/workflows/animation-lab.yml"

permissions:
  contents: read
  # mobends-core, released from `main`.
  packages: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Reference stability, animator parity, side effects
        working-directory: animation-lab
        run: ./gradlew test --no-daemon
        env:
          # Reads mobends-core from GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: animation-lab-test-reports
          path: |
            animation-lab/build/reports/tests/test
            animation-lab/build/traces
